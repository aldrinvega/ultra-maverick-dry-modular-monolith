name: ultramaverick-dry

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ultramaverick.sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ultramaverick.api
    container_name: ultramaverick.api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=ElixirDepotDry;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Jwt__Issuer: "${JWT_ISSUER:-https://localhost:5007}"
      Jwt__Audience: "${JWT_AUDIENCE:-ultramaverick-client}"
      Jwt__Key: "${JWT_KEY:?set JWT_KEY in .env}"
      Jwt__AccessTokenMinutes: "60"
      Jwt__RefreshTokenDays: "7"
    ports:
      - "5007:8080"
    restart: unless-stopped

volumes:
  mssql-data:
